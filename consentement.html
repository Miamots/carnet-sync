<title>Formulaire de consentement · classe nature</title>
<style>
:root{--forest:#3D6A4A;--bg:#F7F3EA;--card:#FFFDF8;--line:#E4DCCB;--ink:#2E3830;--muted:#6B7369;--sun:#E8B84A;--err:#B5523B}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:640px;margin:0 auto;padding:14px 14px 80px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 10px}header img{height:64px;width:auto}
h1{font-size:1.45rem;margin:6px 0 2px;color:var(--forest)}h2{font-size:1.15rem;margin:0 0 8px;color:var(--forest)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.muted{color:var(--muted)}.small{font-size:.88rem}
label.f{display:block;margin:10px 0 0;font-weight:600;font-size:.95rem}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid #CFC6B3;border-radius:12px;background:#fff;margin-top:4px}
.row{display:flex;gap:8px}.row>*{flex:1}
.q{border-top:1px dashed var(--line);padding:12px 0 4px}.q:first-of-type{border-top:0}
.q p{margin:0 0 6px}.why{font-size:.86rem;color:var(--muted);margin:0 0 8px}
.yn{display:flex;gap:10px}.yn button{flex:1;font:inherit;font-weight:700;padding:12px;border-radius:12px;border:2px solid #CFC6B3;background:#fff;color:var(--ink)}
.yn button.on.oui{background:var(--forest);border-color:var(--forest);color:#fff}.yn button.on.non{background:#8A6D5A;border-color:#8A6D5A;color:#fff}
.q.miss .yn button{border-color:var(--err)}.miss input,.miss select{border-color:var(--err)}
ul.names{margin:4px 0 8px 18px;padding:0;font-size:.9rem}
.sig{border:2px dashed #CFC6B3;border-radius:12px;background:#fff;touch-action:none;width:100%;height:170px;display:block;margin-top:6px}
.sig.miss{border-color:var(--err)}
.btn{display:inline-block;font:inherit;font-weight:700;padding:13px 18px;border-radius:999px;border:0;background:var(--forest);color:#fff;width:100%;margin-top:12px}
.btn.ghost{background:transparent;color:var(--forest);border:1px solid var(--forest);width:auto;padding:8px 14px;font-size:.9rem}
.notice{background:#FFF6DB;border:1px solid #EBD38A;border-radius:12px;padding:10px 12px;font-size:.92rem}
.notice.err{background:#FBE9E4;border-color:#E3B2A4}
.done{text-align:center}.done .big{font-size:3rem}
.sum p{margin:4px 0}.sum b{display:inline-block;min-width:2.6em}
@media print{body{background:#fff}.noprint{display:none!important}.card{break-inside:avoid;border-color:#ccc}}
